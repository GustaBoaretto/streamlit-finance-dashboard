name: ETL Pipeline

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  run-etl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      # cria o arquivo .env
      - name: Criar .env
        run: |
          echo "${{ secrets.KEYS_URLS }}" > .env

      - name: Rodar ETL
        run: python -m etl.run_etl
